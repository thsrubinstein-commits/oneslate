<script>
/* ── OneSlate notifications — native iOS via Capacitor Local Notifications ──
   Fires ordinary iOS notifications (banner / lock screen / Notification Center),
   even when the app is fully closed. No server. In a plain browser (no Capacitor
   bridge) this whole block quietly no-ops.

   Two kinds of notifications:
     1. A fixed daily "sync your sleep" nudge (edit SLEEP below).
     2. One per dated thing you've set in the app — every Calendar event, and every
        to-do that has a time + a date. Set those the normal way:
          • Calendar composer:  "Dentist Thursday at 2"  /  "Gym at 6pm tomorrow"
          • To-do quick capture: start the line with a 24h time, e.g. "18:30 Gym"
   The engine re-syncs on every change, on focus, and just before the app backgrounds,
   so freshly-added items get scheduled before iOS suspends the app. Console logs are
   tagged [osnotif] so behaviour is visible in Xcode's console. */
(function () {
  var TAG = '[osnotif]';
  var SLEEP = {
    id: 1001, hour: 8, minute: 0,
    title: 'Sync your sleep',
    body: 'Open OneSlate and make sure last night’s sleep synced from your watch.'
  };

  /* ---------- scheduling core (mirrors scratchpad engine.js, unit-tested) ---------- */
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function hash31(s) { var h = 5381, i = s.length; while (i) { h = (h * 33) ^ s.charCodeAt(--i); } h = h >>> 0; return 100000 + (h % 1900000000); }
  function todayKey(now) { var d = new Date(now); return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
  var TIME_RE = /^(\d{1,2}):(\d{2})/;

  function boardState() { try { return JSON.parse(localStorage.getItem('oneslate:v2') || 'null'); } catch (e) { return null; } }

  function desired(state, now) {
    if (!state) return [];
    now = now || Date.now();
    var HORIZON = now + 1000 * 60 * 60 * 24 * 120, LEAD = 15000, out = [];
    function fireAt(dateKey, time) {
      var dp = dateKey.split('-').map(Number), tp = (time || '09:00').split(':').map(Number);
      return new Date(dp[0], dp[1] - 1, dp[2], tp[0], tp[1], 0).getTime();
    }
    (state.events || []).forEach(function (e) {
      if (!e || !e.date) return;
      var timed = e.time && TIME_RE.test(e.time);
      var when = fireAt(e.date, timed ? e.time : '09:00');
      if (when <= now + LEAD || when > HORIZON) return;
      out.push({ id: hash31('ev:' + e.id), at: when, title: e.title || 'Reminder',
        body: e.notes || (timed ? 'Tap to open OneSlate' : 'All day · tap to open OneSlate') });
    });
    var completed = state.completed || {};
    (state.cards || []).forEach(function (c) {
      (c.items || []).forEach(function (it) {
        if (!it || !it.time || !TIME_RE.test(it.time)) return;
        if (completed[it.id]) return;
        var dateKey = it.due || (c.type === 'home' ? todayKey(now) : null);
        if (!dateKey) return;
        var when = fireAt(dateKey, it.time);
        if (when <= now + LEAD || when > HORIZON) return;
        out.push({ id: hash31('it:' + it.id), at: when, title: (it.text || 'To-do').trim() || 'To-do',
          body: 'Due now · tap to open OneSlate' });
      });
    });
    out.sort(function (a, b) { return a.at - b.at; });
    return out.slice(0, 58);
  }

  /* ---------- native bridge plumbing ---------- */
  function whenReady(cb, tries) {
    tries = tries || 0;
    var C = window.Capacitor;
    var native = C && (!C.isNativePlatform || C.isNativePlatform());
    if (native && C.Plugins && C.Plugins.LocalNotifications) return cb(C.Plugins.LocalNotifications);
    if (tries > 40) { return; }                 // not native (browser) → do nothing
    setTimeout(function () { whenReady(cb, tries + 1); }, 250);
  }

  function ensurePerm(LN, cb) {
    (async function () {
      try {
        var p = await LN.checkPermissions();
        if (p.display !== 'granted') { p = await LN.requestPermissions(); }
        if (p.display !== 'granted') { console.log(TAG, 'permission not granted:', p.display); return; }
        console.log(TAG, 'permission granted — engine active');
        cb();
      } catch (e) { console.log(TAG, 'permission error', e); }
    })();
  }

  var _busy = false, _lastSig = '', _sleepSet = false;
  function reconcile(LN, why) {
    if (_busy) return; _busy = true;
    (async function () {
      try {
        var want = desired(boardState());
        var sig = want.map(function (w) { return w.id + '@' + w.at; }).join(',');
        if (sig !== _lastSig) {
          var wantIds = {}; want.forEach(function (w) { wantIds[w.id] = 1; });
          try {
            var pend = await LN.getPending();
            var stale = (pend.notifications || []).filter(function (n) { return n.id !== SLEEP.id && !wantIds[n.id]; })
              .map(function (n) { return { id: n.id }; });
            if (stale.length) await LN.cancel({ notifications: stale });
          } catch (e) {}
          if (want.length) {
            await LN.schedule({ notifications: want.map(function (w) {
              return { id: w.id, title: w.title, body: w.body,
                schedule: { at: new Date(w.at), allowWhileIdle: true } };
            }) });
          }
          _lastSig = sig;
          console.log(TAG, 'reconcile(' + (why || '') + '): scheduled ' + want.length + ' timed item(s)'
            + (want.length ? ' · next: ' + want[0].title + ' @ ' + new Date(want[0].at).toLocaleString() : ''));
        }
        if (!_sleepSet) {
          await LN.schedule({ notifications: [{ id: SLEEP.id, title: SLEEP.title, body: SLEEP.body,
            schedule: { on: { hour: SLEEP.hour, minute: SLEEP.minute }, allowWhileIdle: true } }] });
          _sleepSet = true;
          console.log(TAG, 'daily sleep reminder set for ' + SLEEP.hour + ':' + two(SLEEP.minute));
        }
      } catch (e) { console.log(TAG, 'reconcile error', e); } finally { _busy = false; }
    })();
  }

  whenReady(function (LN) {
    ensurePerm(LN, function () {
      var run = function (why) { return function () { reconcile(LN, why); }; };
      reconcile(LN, 'startup');
      // Re-sync often enough that a just-added item schedules within seconds…
      setInterval(run('interval'), 15 * 1000);
      // …and immediately at the moments that matter, ESPECIALLY before the app is
      // backgrounded/locked (visibilitychange fires with hidden=true then).
      document.addEventListener('visibilitychange', run('visibility'));
      window.addEventListener('focus', run('focus'));
      window.addEventListener('blur', run('blur'));
      window.addEventListener('pagehide', run('pagehide'));
    });
  });
})();
</script>
